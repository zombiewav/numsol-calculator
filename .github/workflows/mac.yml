name: Build Mac App

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install pyinstaller numpy sympy

      - run: pyinstaller --onefile --noconsole --hidden-import=numpy --hidden-import=sympy main.py

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist/*